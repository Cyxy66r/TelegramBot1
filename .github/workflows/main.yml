      # ============================================================
      # DATABASE HELPERS
      # ============================================================
      def get_db():
          conn = sqlite3.connect(DB_PATH)
          conn.row_factory = sqlite3.Row
          return conn
      
      def log_command(user_id, command, response):
          try:
              conn = get_db()
              cursor = conn.cursor()
              cursor.execute(
                  "INSERT INTO command_logs (bot_name, user_id, command, response) VALUES (?, ?, ?, ?)",
                  (BOT_NAME, user_id, command, response[:500] if response else '')
              )
              conn.commit()
              conn.close()
          except Exception as e:
              logger.error(f"DB log error: {e}")
      
      def log_system(level, message):
          try:
              conn = get_db()
              cursor = conn.cursor()
              cursor.execute(
                  "INSERT INTO system_logs (level, message) VALUES (?, ?)",
                  (level, message)
              )
              conn.commit()
              conn.close()
          except Exception as e:
              pass
      
      def get_user(user_id, username=None, first_name=None, last_name=None):
          try:
              conn = get_db()
              cursor = conn.cursor()
              cursor.execute(
                  "SELECT * FROM users WHERE user_id = ?",
                  (user_id,)
              )
              user = cursor.fetchone()
              if not user:
                  cursor.execute(
                      "INSERT INTO users (user_id, username, first_name, last_name, created_at) VALUES (?, ?, ?, ?, ?)",
                      (user_id, username, first_name, last_name, datetime.now().isoformat())
                  )
                  conn.commit()
              else:
                  cursor.execute(
                      "UPDATE users SET last_active = ? WHERE user_id = ?",
                      (datetime.now().isoformat(), user_id)
                  )
                  conn.commit()
              conn.close()
              return True
          except Exception as e:
              logger.error(f"User DB error: {e}")
              return False
      
      def get_bot_stats():
          try:
              conn = get_db()
              cursor = conn.cursor()
              cursor.execute(
                  "SELECT COUNT(DISTINCT user_id) as users, COUNT(*) as total FROM command_logs WHERE bot_name = ?",
                  (BOT_NAME,)
              )
              stats = cursor.fetchone()
              conn.close()
              return stats
          except:
              return {'users': 0, 'total': 0}
      
      def update_bot_status(status, error_count=0):
          try:
              conn = get_db()
              cursor = conn.cursor()
              cursor.execute(
                  "INSERT OR REPLACE INTO bot_sessions (bot_name, bot_token, status, start_time, total_errors) VALUES (?, ?, ?, ?, ?)",
                  (BOT_NAME, BOT_TOKEN, status, datetime.now().isoformat(), error_count)
              )
              conn.commit()
              conn.close()
          except Exception as e:
              logger.error(f"Status update error: {e}")
      
      # ============================================================
      # COMMAND HANDLERS
      # ============================================================
      
      async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
          user = update.effective_user
          get_user(user.id, user.username, user.first_name, user.last_name)
          
