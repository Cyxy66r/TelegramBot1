                  except:
                      pass
              
              # Start new process
              bot_path = os.path.join(BOTS_PATH, name)
              bot_file = os.path.join(bot_path, 'bot.py')
              
              if os.path.exists(bot_file):
                  subprocess.Popen(['python', bot_file], cwd=bot_path, creationflags=subprocess.CREATE_NEW_CONSOLE)
                  query_db("UPDATE bot_sessions SET status = 'running', start_time = ? WHERE name = ?", (datetime.now().isoformat(), name))
                  return jsonify({'status': 'success', 'message': f'Bot {name} restarted'})
              else:
                  return jsonify({'status': 'error', 'message': 'Bot file not found'}), 404
                  
          except Exception as e:
              return jsonify({'error': str(e)}), 500
      
