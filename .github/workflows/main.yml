name: 🖥️ RDP + Multi-Bot Host (Dashboard + DB)
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration (minutes)'
        required: false
        default: '360'
        type: choice
        options:
          - '60'
          - '120'
          - '240'
          - '360'
          - '720'
      bot_tokens:
        description: 'Bot Tokens (comma separated)'
        required: false
        default: ''
        type: string
      bot_names:
        description: 'Bot Names (comma separated, optional)'
        required: false
        default: ''
        type: string
      persist_data:
        description: 'Persist Data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      auto_restart:
        description: 'Auto-restart on crash'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      web_port:
        description: 'Web Dashboard Port'
        required: false
        default: '5000'
        type: string

jobs:
  rdp-dashboard-bot:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(inputs.duration || 360) }}
    
    steps:
      # ============================================================
      # 1. PERSISTENT STORAGE
      # ============================================================
      - name: Setup Storage
        if: inputs.persist_data == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path C:\Persistent
          New-Item -ItemType Directory -Force -Path C:\Bots
          New-Item -ItemType Directory -Force -Path C:\Dashboard
          New-Item -ItemType Directory -Force -Path C:\Database
          New-Item -ItemType SymbolicLink -Path "C:\Users\Public\Desktop\Persistent" -Target C:\Persistent -Force
          New-Item -ItemType SymbolicLink -Path "C:\Users\Public\Desktop\Bots" -Target C:\Bots -Force
          New-Item -ItemType SymbolicLink -Path "C:\Users\Public\Desktop\Dashboard" -Target C:\Dashboard -Force
          echo "✅ Storage ready"

      # ============================================================
      # 2. RDP CONFIG
      # ============================================================
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Ultimate" 2>$null
          netsh advfirewall firewall add rule name="RDP-Ultimate" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="Dashboard" dir=in action=allow protocol=TCP localport=${{ inputs.web_port }}
          Restart-Service -Name TermService -Force

      # ============================================================
      # 3. CREATE USER
      # ============================================================
      - name: Create RDP User
        run: |
          $password = -join ((65..90) + (97..122) + (48..57) + (33..47) + (58..64) | Get-Random -Count 16 | ForEach-Object { [char]$_ })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Admin" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Admin"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      # ============================================================
      # 4. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-dash-$env:GITHUB_RUN_ID
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      # ============================================================
      # 5. INSTALL PYTHON & DEPS
      # ============================================================
      - name: Install Python
        run: |
          $url = "https://www.python.org/ftp/python/3.12.0/python-3.12.0-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\python.exe"
          Start-Process -FilePath "$env:TEMP\python.exe" -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1" -Wait

      - name: Install Dependencies
        if: inputs.bot_tokens != ''
        run: |
          pip install python-telegram-bot requests flask aiohttp aiofiles schedule psutil sqlite3 flask-cors markdown

      # ============================================================
      # 6. SETUP SQLITE DATABASE
      # ============================================================
      - name: Setup Database
        if: inputs.bot_tokens != ''
        run: |
          New-Item -ItemType Directory -Force -Path C:\Database
          
          @"
      -- ============================================================
      -- BOT DATABASE SCHEMA
      -- ============================================================
      
      -- Users table
      CREATE TABLE IF NOT EXISTS users (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          user_id INTEGER UNIQUE NOT NULL,
          username TEXT,
          first_name TEXT,
          last_name TEXT,
          is_premium INTEGER DEFAULT 0,
          is_admin INTEGER DEFAULT 0,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          last_active TIMESTAMP
      );
      
      -- Bot sessions table
      CREATE TABLE IF NOT EXISTS bot_sessions (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          bot_name TEXT NOT NULL,
          bot_token TEXT NOT NULL,
          status TEXT DEFAULT 'stopped',
          start_time TIMESTAMP,
          last_heartbeat TIMESTAMP,
          total_requests INTEGER DEFAULT 0,
          total_errors INTEGER DEFAULT 0,
          config TEXT
      );
      
      -- Command logs table
      CREATE TABLE IF NOT EXISTS command_logs (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          bot_name TEXT NOT NULL,
          user_id INTEGER,
          command TEXT,
          response TEXT,
          timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      
      -- User data table (custom data per bot)
      CREATE TABLE IF NOT EXISTS user_data (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          bot_name TEXT NOT NULL,
          user_id INTEGER NOT NULL,
          key TEXT NOT NULL,
          value TEXT,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          UNIQUE(bot_name, user_id, key)
      );
      
      -- System logs
      CREATE TABLE IF NOT EXISTS system_logs (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          level TEXT,
          message TEXT,
          timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      
      -- Indexes
      CREATE INDEX IF NOT EXISTS idx_user_data_bot ON user_data(bot_name, user_id);
      CREATE INDEX IF NOT EXISTS idx_command_logs_bot ON command_logs(bot_name, timestamp);
      CREATE INDEX IF NOT EXISTS idx_system_logs_time ON system_logs(timestamp);
      "@ | Out-File -FilePath "C:\Database\schema.sql" -Encoding UTF8
          
          # Initialize database
          sqlite3 C:\Database\bots.db < C:\Database\schema.sql
          echo "✅ Database initialized"

      # ============================================================
      # 7. CREATE WEB DASHBOARD
      # ============================================================
      - name: Create Web Dashboard
        if: inputs.bot_tokens != ''
        run: |
          New-Item -ItemType Directory -Force -Path C:\Dashboard
          New-Item -ItemType Directory -Force -Path C:\Dashboard\templates
          New-Item -ItemType Directory -Force -Path C:\Dashboard\static
          
          # ===== HTML DASHBOARD =====
          @"
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>🤖 Bot Dashboard</title>
          <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                  font-family: 'Segoe UI', system-ui, sans-serif;
                  background: #0b0e14;
                  color: #e8edf5;
                  min-height: 100vh;
                  padding: 20px;
              }
              .container { max-width: 1400px; margin: 0 auto; }
              .header {
                  display: flex; justify-content: space-between; align-items: center;
                  background: #131a24; padding: 18px 24px; border-radius: 16px;
                  border: 1px solid #1e2a36; margin-bottom: 24px;
              }
              .logo {
                  font-size: 24px; font-weight: 700;
                  background: linear-gradient(135deg, #a855f7, #6366f1);
                  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
              }
              .status {
                  font-size: 13px; color: #8aa0b8;
                  background: #1a2632; padding: 6px 18px; border-radius: 40px;
                  border: 1px solid #2a3a4a;
              }
              .status .dot {
                  display: inline-block; width: 8px; height: 8px;
                  background: #22c55e; border-radius: 50%; margin-right: 8px;
                  animation: pulse 1.8s infinite;
              }
              @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
              
              .grid {
                  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                  gap: 16px; margin-bottom: 24px;
              }
              .stat-card {
                  background: #131a24; border-radius: 14px; padding: 16px 20px;
                  border: 1px solid #1e2a36; text-align: center;
              }
              .stat-card .label { font-size: 12px; color: #6b7b8d; text-transform: uppercase; }
              .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
              .stat-card .value.green { color: #22c55e; }
              .stat-card .value.blue { color: #3b82f6; }
              .stat-card .value.purple { color: #a855f7; }
              .stat-card .value.gold { color: #f59e0b; }
              .stat-card .value.red { color: #ef4444; }
              
              .panel {
                  background: #131a24; border-radius: 14px;
                  border: 1px solid #1e2a36; padding: 20px;
                  margin-bottom: 20px;
              }
              .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #b0c4db; }
              
              table {
                  width: 100%; border-collapse: collapse; font-size: 14px;
              }
              th, td {
                  padding: 10px 14px; text-align: left;
                  border-bottom: 1px solid #1e2a36;
              }
              th { color: #6b7b8d; font-weight: 500; font-size: 12px; text-transform: uppercase; }
              tr:hover { background: #0b0e14; }
              
              .badge {
                  display: inline-block; padding: 2px 12px; border-radius: 20px;
                  font-size: 12px; font-weight: 500;
              }
              .badge.online { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e40; }
              .badge.offline { background: #ef444420; color: #ef4444; border: 1px solid #ef444440; }
              .badge.error { background: #f59e0b20; color: #f59e0b; border: 1px solid #f59e0b40; }
              
              .btn {
                  padding: 6px 14px; border: none; border-radius: 8px;
                  font-weight: 500; font-size: 12px; cursor: pointer;
                  transition: 0.2s;
              }
              .btn-primary { background: #6366f1; color: #fff; }
              .btn-primary:hover { background: #4f52e0; }
              .btn-danger { background: #ef4444; color: #fff; }
              .btn-danger:hover { background: #dc2626; }
              .btn-success { background: #22c55e; color: #fff; }
              .btn-success:hover { background: #16a34a; }
              .btn-sm { padding: 4px 10px; font-size: 11px; }
              
              .refresh-btn {
                  background: #1a2632; border: 1px solid #2a3a4a;
                  color: #b0c4db; padding: 6px 16px; border-radius: 8px;
                  cursor: pointer;
              }
              .refresh-btn:hover { border-color: #4a5a6a; }
              
              .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
              .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
              
              .log-box {
                  background: #0b0e14; border-radius: 10px; padding: 12px 16px;
                  max-height: 300px; overflow-y: auto;
                  font-family: monospace; font-size: 12px; color: #8aa0b8;
                  line-height: 1.8;
              }
              .log-box .info { color: #3b82f6; }
              .log-box .success { color: #22c55e; }
              .log-box .error { color: #ef4444; }
              .log-box .warn { color: #f59e0b; }
              
              ::-webkit-scrollbar { width: 5px; }
              ::-webkit-scrollbar-track { background: #0b0e14; }
              ::-webkit-scrollbar-thumb { background: #1e2a36; border-radius: 10px; }
              
              @media (max-width: 600px) {
                  .grid { grid-template-columns: 1fr 1fr; }
                  .header { flex-direction: column; align-items: flex-start; gap: 10px; }
              }
          </style>
      </head>
      <body>
          <div class="container">
              <!-- Header -->
              <div class="header">
                  <div class="logo">🤖 Bot Dashboard</div>
                  <div class="status">
                      <span class="dot"></span> Live &nbsp;|&nbsp;
                      <span id="lastUpdate">Updating...</span>
                  </div>
              </div>
              
              <!-- Stats -->
              <div class="grid" id="statsGrid">
                  <div class="stat-card">
                      <div class="label">Total Bots</div>
                      <div class="value blue" id="statBots">0</div>
                  </div>
                  <div class="stat-card">
                      <div class="label">Online</div>
                      <div class="value green" id="statOnline">0</div>
                  </div>
                  <div class="stat-card">
                      <div class="label">Total Users</div>
                      <div class="value purple" id="statUsers">0</div>
                  </div>
                  <div class="stat-card">
                      <div class="label">Total Requests</div>
                      <div class="value gold" id="statRequests">0</div>
                  </div>
                  <div class="stat-card">
                      <div class="label">Errors</div>
                      <div class="value red" id="statErrors">0</div>
                  </div>
              </div>
              
              <!-- Controls -->
              <div class="panel">
                  <div class="flex-between">
                      <div class="panel-title">🤖 Bot Controls</div>
                      <div class="flex">
                          <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh</button>
                          <button class="btn btn-primary" onclick="restartAll()">Restart All</button>
                          <button class="btn btn-danger" onclick="stopAll()">Stop All</button>
                      </div>
                  </div>
              </div>
              
              <!-- Bot List -->
              <div class="panel">
                  <div class="panel-title">📋 Bot List</div>
                  <div style="overflow-x:auto;">
                      <table>
                          <thead>
                              <tr>
                                  <th>Bot Name</th>
                                  <th>Status</th>
                                  <th>Uptime</th>
                                  <th>Requests</th>
                                  <th>Users</th>
                                  <th>Actions</th>
                              </tr>
                          </thead>
                          <tbody id="botTableBody">
                              <tr><td colspan="6" style="text-align:center;color:#6b7b8d;">Loading bots...</td></tr>
                          </tbody>
                      </table>
                  </div>
              </div>
              
              <!-- Recent Commands -->
              <div class="panel">
                  <div class="flex-between">
                      <div class="panel-title">📝 Recent Commands</div>
                      <button class="refresh-btn" onclick="refreshCommands()">🔄 Refresh</button>
                  </div>
                  <div style="overflow-x:auto;">
                      <table>
                          <thead>
                              <tr>
                                  <th>Time</th>
                                  <th>Bot</th>
                                  <th>User</th>
                                  <th>Command</th>
                                  <th>Response</th>
                              </tr>
                          </thead>
                          <tbody id="commandsTableBody">
                              <tr><td colspan="5" style="text-align:center;color:#6b7b8d;">No commands yet</td></tr>
                          </tbody>
                      </table>
                  </div>
              </div>
              
              <!-- Logs -->
              <div class="panel">
                  <div class="flex-between">
                      <div class="panel-title">📜 System Logs</div>
                      <button class="refresh-btn" onclick="refreshLogs()">🔄 Refresh</button>
                  </div>
                  <div class="log-box" id="logBox">Waiting for logs...</div>
              </div>
          </div>
          
          <script>
              // ============================================================
              // API ENDPOINTS
              // ============================================================
              const API_BASE = '/api';
              
              async function fetchAPI(endpoint) {
                  try {
                      const res = await fetch(`${API_BASE}${endpoint}`);
                      return await res.json();
                  } catch (e) {
                      console.error('API Error:', e);
                      return { error: e.message };
                  }
              }
              
              // ============================================================
              // REFRESH FUNCTIONS
              // ============================================================
              async function refreshAll() {
                  await Promise.all([refreshStats(), refreshBots(), refreshCommands(), refreshLogs()]);
                  document.getElementById('lastUpdate').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
              }
              
              async function refreshStats() {
                  const data = await fetchAPI('/stats');
                  if (!data.error) {
                      document.getElementById('statBots').textContent = data.total_bots || 0;
                      document.getElementById('statOnline').textContent = data.online_bots || 0;
                      document.getElementById('statUsers').textContent = data.total_users || 0;
                      document.getElementById('statRequests').textContent = data.total_requests || 0;
                      document.getElementById('statErrors').textContent = data.total_errors || 0;
                  }
              }
              
              async function refreshBots() {
                  const data = await fetchAPI('/bots');
                  const tbody = document.getElementById('botTableBody');
                  
                  if (!data.bots || data.bots.length === 0) {
                      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6b7b8d;">No bots configured</td></tr>';
                      return;
                  }
                  
                  tbody.innerHTML = data.bots.map(bot => {
                      const statusClass = bot.status === 'running' ? 'online' : bot.status === 'error' ? 'error' : 'offline';
                      const statusText = bot.status === 'running' ? '🟢 Online' : bot.status === 'error' ? '🟡 Error' : '🔴 Offline';
                      const uptime = bot.uptime || 'N/A';
                      
                      return `
                          <tr>
                              <td><strong>${bot.name}</strong></td>
                              <td><span class="badge ${statusClass}">${statusText}</span></td>
                              <td>${uptime}</td>
                              <td>${bot.requests || 0}</td>
                              <td>${bot.users || 0}</td>
                              <td>
                                  <button class="btn btn-success btn-sm" onclick="restartBot('${bot.name}')">Restart</button>
                                  <button class="btn btn-danger btn-sm" onclick="stopBot('${bot.name}')">Stop</button>
                              </td>
                          </tr>
                      `;
                  }).join('');
              }
              
              async function refreshCommands() {
                  const data = await fetchAPI('/commands');
                  const tbody = document.getElementById('commandsTableBody');
                  
                  if (!data.commands || data.commands.length === 0) {
                      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b7b8d;">No commands yet</td></tr>';
                      return;
                  }
                  
                  tbody.innerHTML = data.commands.slice(0, 20).map(cmd => `
                      <tr>
                          <td style="font-size:12px;color:#6b7b8d;">${cmd.timestamp}</td>
                          <td><strong>${cmd.bot}</strong></td>
                          <td>${cmd.user || 'N/A'}</td>
                          <td><code style="background:#1a2632;padding:2px 8px;border-radius:4px;">${cmd.command}</code></td>
                          <td style="font-size:13px;color:#8aa0b8;">${cmd.response || '-'}</td>
                      </tr>
                  `).join('');
              }
              
              async function refreshLogs() {
                  const data = await fetchAPI('/logs');
                  const logBox = document.getElementById('logBox');
                  
                  if (!data.logs || data.logs.length === 0) {
                      logBox.textContent = 'No logs available';
                      return;
                  }
                  
                  logBox.innerHTML = data.logs.slice(-30).map(log => {
                      const levelClass = log.level === 'INFO' ? 'info' : log.level === 'SUCCESS' ? 'success' : log.level === 'ERROR' ? 'error' : 'warn';
                      return `<div class="${levelClass}">[${log.timestamp}] ${log.message}</div>`;
                  }).join('');
              }
              
              // ============================================================
              // ACTIONS
              // ============================================================
              async function restartBot(name) {
                  if (!confirm(`Restart bot: ${name}?`)) return;
                  const data = await fetchAPI(`/bot/${name}/restart`, { method: 'POST' });
                  alert(data.message || 'Restart triggered');
                  refreshAll();
              }
              
              async function stopBot(name) {
                  if (!confirm(`Stop bot: ${name}?`)) return;
                  const data = await fetchAPI(`/bot/${name}/stop`, { method: 'POST' });
                  alert(data.message || 'Stop triggered');
                  refreshAll();
              }
              
              async function restartAll() {
                  if (!confirm('Restart ALL bots?')) return;
                  const data = await fetchAPI('/bots/restart', { method: 'POST' });
                  alert(data.message || 'Restarting all bots...');
                  refreshAll();
              }
              
              async function stopAll() {
                  if (!confirm('Stop ALL bots?')) return;
                  const data = await fetchAPI('/bots/stop', { method: 'POST' });
                  alert(data.message || 'Stopping all bots...');
                  refreshAll();
              }
              
              // ============================================================
              // AUTO REFRESH
              // ============================================================
              refreshAll();
              setInterval(refreshAll, 5000);
          </script>
      </body>
      </html>
      "@ | Out-File -FilePath "C:\Dashboard\templates\index.html" -Encoding UTF8

      # ============================================================
      # 8. CREATE FLASK API SERVER
      # ============================================================
      - name: Create Flask API Server
        if: inputs.bot_tokens != ''
        run: |
          @"
      # ============================================================
      # FLASK API SERVER WITH DATABASE
      # ============================================================
      import os
      import sys
      import json
      import sqlite3
      import subprocess
      import psutil
      import time
      from datetime import datetime, timedelta
      from flask import Flask, request, jsonify, render_template
      from flask_cors import CORS
      import logging
      
      # Setup logging
      logging.basicConfig(level=logging.INFO)
      logger = logging.getLogger(__name__)
      
      app = Flask(__name__, template_folder='templates', static_folder='static')
      CORS(app)
      
      # Database path
      DB_PATH = r"C:\Database\bots.db"
      BOTS_PATH = r"C:\Bots"
      
      # ============================================================
      # DATABASE HELPERS
      # ============================================================
      def get_db():
          conn = sqlite3.connect(DB_PATH)
          conn.row_factory = sqlite3.Row
          return conn
      
      def query_db(query, params=(), fetch_one=False, fetch_all=False):
          conn = get_db()
          cursor = conn.cursor()
          cursor.execute(query, params)
          if fetch_one:
              result = cursor.fetchone()
          elif fetch_all:
              result = cursor.fetchall()
          else:
              result = None
          conn.commit()
          conn.close()
          return result
      
      # ============================================================
      # API ENDPOINTS
      # ============================================================
      
      @app.route('/')
      def index():
          return render_template('index.html')
      
      @app.route('/api/stats')
      def api_stats():
          try:
              # Get bot status from database
              bots = query_db("SELECT name, status, total_requests, total_errors FROM bot_sessions", fetch_all=True)
              total_bots = len(bots) if bots else 0
              online_bots = sum(1 for b in bots if b and b['status'] == 'running') if bots else 0
              total_requests = sum(b['total_requests'] for b in bots) if bots else 0
              total_errors = sum(b['total_errors'] for b in bots) if bots else 0
              
              # Get total users
              users = query_db("SELECT COUNT(*) as count FROM users", fetch_one=True)
              total_users = users['count'] if users else 0
              
              return jsonify({
                  'total_bots': total_bots,
                  'online_bots': online_bots,
                  'total_users': total_users,
                  'total_requests': total_requests,
                  'total_errors': total_errors
              })
          except Exception as e:
              return jsonify({'error': str(e)}), 500
      
      @app.route('/api/bots')
      def api_bots():
          try:
              bots = query_db("SELECT * FROM bot_sessions", fetch_all=True)
              result = []
              
              if bots:
                  for bot in bots:
                      # Calculate uptime
                      uptime = 'N/A'
                      if bot['start_time']:
                          start = datetime.fromisoformat(bot['start_time'])
                          elapsed = datetime.now() - start
                          hours, remainder = divmod(elapsed.total_seconds(), 3600)
                          minutes, seconds = divmod(remainder, 60)
                          uptime = f"{int(hours)}h {int(minutes)}m {int(seconds)}s"
                      
                      # Get user count for this bot
                      users = query_db("SELECT COUNT(DISTINCT user_id) as count FROM command_logs WHERE bot_name = ?", (bot['name'],), fetch_one=True)
                      user_count = users['count'] if users else 0
                      
                      result.append({
                          'name': bot['name'],
                          'status': bot['status'],
                          'uptime': uptime,
                          'requests': bot['total_requests'] or 0,
                          'users': user_count,
                          'errors': bot['total_errors'] or 0
                      })
              
              return jsonify({'bots': result})
          except Exception as e:
              return jsonify({'error': str(e)}), 500
      
