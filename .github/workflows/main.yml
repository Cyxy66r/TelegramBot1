name: 🖥️ RDP + Multi-Bot Host (Dashboard + DB)
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration (minutes)'
        required: false
        default: '360'
        type: choice
        options:
          - '60'
          - '120'
          - '240'
          - '360'
          - '720'
      bot_tokens:
        description: 'Bot Tokens (comma separated)'
        required: false
        default: ''
        type: string
      bot_names:
        description: 'Bot Names (comma separated, optional)'
        required: false
        default: ''
        type: string
      persist_data:
        description: 'Persist Data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      auto_restart:
        description: 'Auto-restart on crash'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      web_port:
        description: 'Web Dashboard Port'
        required: false
        default: '5000'
        type: string

jobs:
  rdp-dashboard-bot:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(inputs.duration || 360) }}
    
    steps:
      - name: Setup Storage
        if: inputs.persist_data == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path C:\Persistent
          New-Item -ItemType Directory -Force -Path C:\Bots
          New-Item -ItemType Directory -Force -Path C:\Dashboard
          New-Item -ItemType Directory -Force -Path C:\Database
          echo "Storage ready"

      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create User
        run: |
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 12 | ForEach-Object { [char]$_ })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Admin" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Admin"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "$env:TEMP\tailscale.msi", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-rdp
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Install Python
        run: |
          $url = "https://www.python.org/ftp/python/3.12.0/python-3.12.0-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\python.exe"
          Start-Process -FilePath "$env:TEMP\python.exe" -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1" -Wait

      - name: Install Dependencies
        if: inputs.bot_tokens != ''
        run: |
          pip install python-telegram-bot requests flask aiohttp psutil

      - name: Setup Database
        if: inputs.bot_tokens != ''
        run: |
          New-Item -ItemType Directory -Force -Path C:\Database
          sqlite3 C:\Database\bots.db "CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, user_id INTEGER, username TEXT, created_at TEXT);"
          sqlite3 C:\Database\bots.db "CREATE TABLE IF NOT EXISTS bot_sessions (id INTEGER PRIMARY KEY, bot_name TEXT, bot_token TEXT, status TEXT, start_time TEXT);"
          sqlite3 C:\Database\bots.db "CREATE TABLE IF NOT EXISTS command_logs (id INTEGER PRIMARY KEY, bot_name TEXT, user_id INTEGER, command TEXT, response TEXT, timestamp TEXT);"
          sqlite3 C:\Database\bots.db "CREATE TABLE IF NOT EXISTS system_logs (id INTEGER PRIMARY KEY, level TEXT, message TEXT, timestamp TEXT);"
          echo "Database initialized"

      - name: Create Bot Files
        if: inputs.bot_tokens != ''
        run: |
          New-Item -ItemType Directory -Force -Path C:\Bots
          $tokens = "${{ inputs.bot_tokens }}".Split(',')
          $i = 0
          foreach ($token in $tokens) {
            $botName = "Bot_$i"
            $botPath = "C:\Bots\$botName"
            New-Item -ItemType Directory -Force -Path $botPath
            
            $botCode = @'
      import asyncio
      import logging
      import sqlite3
      import time
      import sys
      from datetime import datetime
      from telegram import Update, InlineKeyboardButton, InlineKeyboardMarkup
      from telegram.ext import ApplicationBuilder, CommandHandler, CallbackQueryHandler, ContextTypes
      
      logging.basicConfig(level=logging.INFO)
      logger = logging.getLogger(__name__)
      
      BOT_TOKEN = "TOKEN_HERE"
      BOT_NAME = "BOT_NAME_HERE"
      DB_PATH = r"C:\Database\bots.db"
      
      def log_command(user_id, command, response):
          try:
              conn = sqlite3.connect(DB_PATH)
              cursor = conn.cursor()
              cursor.execute("INSERT INTO command_logs (bot_name, user_id, command, response, timestamp) VALUES (?, ?, ?, ?, ?)",
                           (BOT_NAME, user_id, command, response[:500], datetime.now().isoformat()))
              conn.commit()
              conn.close()
          except:
              pass
      
      async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
          user = update.effective_user
          keyboard = [[InlineKeyboardButton("Status", callback_data="status")]]
          reply_markup = InlineKeyboardMarkup(keyboard)
          await update.message.reply_text(f"Bot {BOT_NAME} is alive!", reply_markup=reply_markup)
          log_command(user.id, "/start", "Menu shown")
      
      async def ping(update: Update, context: ContextTypes.DEFAULT_TYPE):
          await update.message.reply_text("Pong!")
          log_command(update.effective_user.id, "/ping", "Pong")
      
      async def status(update: Update, context: ContextTypes.DEFAULT_TYPE):
          await update.message.reply_text("Bot is running on RDP")
          log_command(update.effective_user.id, "/status", "Status shown")
      
      async def button_callback(update: Update, context: ContextTypes.DEFAULT_TYPE):
          query = update.callback_query
          await query.answer()
          await query.edit_message_text("Status: Online")
      
      async def main():
          app = ApplicationBuilder().token(BOT_TOKEN).build()
          app.add_handler(CommandHandler("start", start))
          app.add_handler(CommandHandler("ping", ping))
          app.add_handler(CommandHandler("status", status))
          app.add_handler(CallbackQueryHandler(button_callback))
          logger.info(f"Bot {BOT_NAME} started")
          await app.run_polling()
      
      if __name__ == "__main__":
          asyncio.run(main())
      '@
            
            $botCode = $botCode -replace "TOKEN_HERE", $token
            $botCode = $botCode -replace "BOT_NAME_HERE", $botName
            $botCode | Out-File -FilePath "$botPath\bot.py" -Encoding UTF8
            
            sqlite3 C:\Database\bots.db "INSERT OR REPLACE INTO bot_sessions (bot_name, bot_token, status) VALUES ('$botName', '$token', 'stopped');"
            Write-Host "Created bot: $botName"
            $i++
          }
          echo "BOT_COUNT=$i" >> $env:GITHUB_ENV

      - name: Start Services
        if: inputs.bot_tokens != ''
        run: |
          $count = [int]$env:BOT_COUNT
          for ($i = 0; $i -lt $count; $i++) {
            $botPath = "C:\Bots\Bot_$i"
            if (Test-Path "$botPath\bot.py") {
              Start-Process -FilePath "python" -ArgumentList "$botPath\bot.py" -NoNewWindow
              Start-Sleep -Seconds 2
            }
          }
          echo "Services started"

      - name: Show Access
        run: |
          $ip = $env:TAILSCALE_IP
          $password = $env:RDP_PASSWORD
          Write-Host ""
          Write-Host "========================================="
          Write-Host "  RDP ACCESS DETAILS"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "  Address:  $ip"
          Write-Host "  Username: Admin"
          Write-Host "  Password: $password"
          Write-Host ""
          Write-Host "========================================="

      - name: Keep Alive
        run: |
          $startTime = Get-Date
          $duration = ${{ inputs.duration }} * 60
          while ($true) {
            $elapsed = (Get-Date) - $startTime
            $remaining = $duration - $elapsed.TotalSeconds
            if ($remaining -le 0) { break }
            Write-Host "[$(Get-Date)] Active | Remaining: $([math]::Floor($remaining/60)) minutes"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        run: |
          if (Test-Path C:\Bots) { Compress-Archive -Path C:\Bots\* -DestinationPath C:\bots_backup.zip -Force }
          if (Test-Path C:\Database) { Compress-Archive -Path C:\Database\* -DestinationPath C:\database_backup.zip -Force }

      - name: Upload Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup
          path: |
            C:\bots_backup.zip
            C:\database_backup.zip
          retention-days: 7
          if-no-files-found: ignore
