      # ============================================================
      # USER DATA STORAGE (KEY-VALUE)
      # ============================================================
      
      async def save(update: Update, context: ContextTypes.DEFAULT_TYPE):
          args = context.args
          if len(args) < 2:
              await update.message.reply_text("❌ Usage: `/save key value`", parse_mode='Markdown')
              return
          
          key = args[0]
          value = ' '.join(args[1:])
