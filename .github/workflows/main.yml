            }
            
            $hours = [math]::Floor($remaining / 3600)
            $minutes = [math]::Floor(($remaining % 3600) / 60)
            $seconds = [math]::Floor($remaining % 60)
            
            $botProcesses = Get-Process python -ErrorAction SilentlyContinue
            $botCount = if ($botProcesses) { $botProcesses.Count } else { 0 }
            
            Write-Host "[$(Get-Date)] 🟢 Active | $($hours)h $($minutes)m $($seconds)s | IP: $ip | Processes: $botCount"
            
            $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status
            if ($tsStatus -match "offline") {
              Write-Host "⚠️ Tailscale disconnected! Reconnecting..."
              & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
            }
            
            Start-Sleep -Seconds 60
          }

      # ============================================================
      # 15. CLEANUP & BACKUP
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          if (Test-Path C:\Bots) { Compress-Archive -Path C:\Bots\* -DestinationPath C:\bots_backup.zip -Force }
          if (Test-Path C:\Database) { Compress-Archive -Path C:\Database\* -DestinationPath C:\database_backup.zip -Force }
          if (Test-Path C:\Dashboard) { Compress-Archive -Path C:\Dashboard\* -DestinationPath C:\dashboard_backup.zip -Force }
          Remove-Item -Path C:\Users\*\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue

      # ============================================================
      # 16. UPLOAD BACKUP
      # ============================================================
      - name: Upload Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-backup
          path: |
            C:\bots_backup.zip
            C:\database_backup.zip
            C:\dashboard_backup.zip
            C:\Database\bots.db
          retention-days: 7
          if-no-files-found: ignore
